@if (variant() === 'circle') {
  <div class="flex flex-col items-center gap-3">
    <div class="relative">
      @if (displayUrl()) {
        <img
          [src]="displayUrl()"
          alt="Profile photo"
          class="h-20 w-20 rounded-full object-cover ring-4 ring-white/20"
        />
      } @else {
        <div
          class="flex h-20 w-20 items-center justify-center rounded-full bg-white/20 text-3xl font-bold ring-4 ring-white/20"
        >
          {{ initial().charAt(0).toUpperCase() }}
        </div>
      }
      @if (uploading()) {
        <div
          class="absolute inset-0 flex items-center justify-center rounded-full bg-slate-900/50 text-xs font-semibold text-white"
        >
          Uploading...
        </div>
      }
    </div>
    <label
      class="cursor-pointer rounded-lg bg-white/15 px-4 py-2 text-sm font-semibold text-white ring-1 ring-white/30 backdrop-blur transition hover:bg-white/25"
      [class.pointer-events-none]="uploading()"
      [class.opacity-60]="uploading()"
    >
      {{ uploading() ? 'Uploading...' : buttonLabel() }}
      <input type="file" accept="image/jpeg,image/png,image/webp" class="hidden" (change)="onFileChange($event)" />
    </label>
  </div>
} @else {
  <div class="space-y-3">
    @if (displayUrl()) {
      <div class="relative overflow-hidden rounded-2xl ring-1 ring-slate-200">
        <img [src]="displayUrl()" alt="Parking photo" class="h-44 w-full object-cover" />
        @if (uploading()) {
          <div
            class="absolute inset-0 flex items-center justify-center bg-slate-900/50 text-sm font-semibold text-white"
          >
            Uploading...
          </div>
        }
      </div>
    } @else {
      <div
        class="flex h-44 w-full flex-col items-center justify-center gap-2 rounded-2xl bg-slate-100 text-slate-400 ring-1 ring-slate-200"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-10 w-10" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <circle cx="9" cy="9" r="2" />
          <path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21" />
        </svg>
        <span class="text-xs font-semibold">No photo yet</span>
      </div>
    }
    <label
      class="inline-block cursor-pointer rounded-xl bg-slate-100 px-4 py-2 text-sm font-semibold text-slate-700 ring-1 ring-slate-200 transition hover:bg-slate-200"
      [class.pointer-events-none]="uploading()"
      [class.opacity-60]="uploading()"
    >
      {{ uploading() ? 'Uploading...' : buttonLabel() }}
      <input type="file" accept="image/jpeg,image/png,image/webp" class="hidden" (change)="onFileChange($event)" />
    </label>
  </div>
}
