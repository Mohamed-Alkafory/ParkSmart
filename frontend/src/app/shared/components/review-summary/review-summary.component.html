<div class="flex flex-col gap-6 sm:flex-row sm:items-center">
  <div class="shrink-0 text-center sm:text-left">
    <p class="text-5xl font-extrabold text-[#003366]">{{ stats().avg }}</p>
    <div class="mt-1 flex justify-center sm:justify-start">
      <app-rating [value]="stats().avg" [readonly]="true" />
    </div>
    <p class="mt-1 text-sm text-slate-500">
      {{ stats().total }} review{{ stats().total === 1 ? '' : 's' }}
    </p>
  </div>
  <div class="min-w-0 flex-1 space-y-2">
    @for (row of stats().dist; track row.star) {
      <div class="flex items-center gap-2 text-sm">
        <span class="w-3 text-right font-semibold text-slate-600">{{ row.star }}</span>
        <span class="text-amber-400" aria-hidden="true">★</span>
        <div
          class="h-2.5 min-w-0 flex-1 overflow-hidden rounded-full bg-slate-200"
          role="img"
          [attr.aria-label]="row.count + ' reviews with ' + row.star + ' stars'"
        >
          <div class="h-full rounded-full bg-amber-400 transition-all" [style.width.%]="row.pct"></div>
        </div>
        <span class="w-10 text-right text-xs tabular-nums text-slate-500">{{ row.pct }}%</span>
      </div>
    }
  </div>
</div>
