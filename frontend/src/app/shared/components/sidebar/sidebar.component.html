<!-- Fixed app sidebar: full viewport height, flush to the top-left viewport
     edges, always visible while content scrolls. Hidden below lg, where the
     navbar hamburger menu takes over navigation. Content pages offset
     themselves with lg:ml-64. -->
<aside
  class="fixed inset-y-0 left-0 z-40 hidden w-64 overflow-hidden bg-slate-950 text-white shadow-xl lg:block"
>
  <!-- Links change automatically when the role input changes. -->
  <nav
    class="flex h-full flex-col gap-2 overflow-y-auto p-3 pt-20"
    aria-label="Dashboard navigation"
  >
    @for (link of links(); track link.route) {
      <a
        [routerLink]="link.route"
        routerLinkActive="bg-white text-slate-950 shadow-sm"
        [routerLinkActiveOptions]="{ exact: link.route === '/parkings' }"
        class="flex shrink-0 items-center gap-3 rounded-xl px-4 py-3 text-sm font-semibold text-slate-300 transition hover:bg-white/10 hover:text-white lg:w-full"
      >
        <span
          class="flex h-8 w-8 items-center justify-center rounded-lg bg-white/10 text-xs font-bold"
          aria-hidden="true"
        >
          {{ link.icon }}
        </span>
        <span>{{ link.label }}</span>
      </a>
    }
  </nav>
</aside>
