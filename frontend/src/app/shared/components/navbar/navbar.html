<nav class="bg-slate-900 text-white shadow">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
    <a routerLink="/parkings" class="text-lg font-bold tracking-tight"> ParkSmart </a>

    <div class="flex items-center gap-2 text-sm">
      <a
        routerLink="/parkings"
        routerLinkActive="bg-slate-700"
        [routerLinkActiveOptions]="{ exact: false }"
        class="rounded-lg px-3 py-2 hover:bg-slate-700"
      >
        Parkings
      </a>

      @if (isLoggedIn()) {
        @if (isOwner()) {
          <a
            routerLink="/parkings/new"
            routerLinkActive="bg-slate-700"
            class="rounded-lg px-3 py-2 hover:bg-slate-700"
          >
            Add parking
          </a>
        }
        <a
          routerLink="/bookings"
          routerLinkActive="bg-slate-700"
          class="rounded-lg px-3 py-2 hover:bg-slate-700"
        >
          My bookings
        </a>
        <a
          routerLink="/notifications"
          routerLinkActive="bg-slate-700"
          class="rounded-lg px-3 py-2 hover:bg-slate-700"
        >
          Notifications
        </a>
        @if (!isAdmin()) {
          <a
            [routerLink]="profileLink()"
            routerLinkActive="bg-slate-700"
            class="rounded-lg px-3 py-2 hover:bg-slate-700"
          >
            Profile
          </a>
        }
        <span class="hidden px-2 text-slate-300 md:inline">
          {{ currentUser()?.name }}
        </span>
        <button
          type="button"
          (click)="logout()"
          class="rounded-lg bg-slate-700 px-3 py-2 hover:bg-slate-600"
        >
          Logout
        </button>
      } @else {
        <a
          routerLink="/login"
          routerLinkActive="bg-slate-700"
          class="rounded-lg px-3 py-2 hover:bg-slate-700"
        >
          Login
        </a>
        <a
          routerLink="/register"
          routerLinkActive="bg-slate-700"
          class="rounded-lg bg-emerald-600 px-3 py-2 hover:bg-emerald-500"
        >
          Register
        </a>
      }
    </div>
  </div>
</nav>
