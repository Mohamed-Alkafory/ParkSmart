<div class="rounded-3xl bg-gradient-to-r from-[#003366] to-[#0060C0] p-6 text-white shadow-lg sm:p-8">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div class="min-w-0">
      @if (eyebrow()) {
        <p class="text-sm font-semibold uppercase tracking-wider text-blue-100">{{ eyebrow() }}</p>
      }
      <h1 class="mt-2 text-3xl font-bold">{{ title() }}</h1>
      @if (subtitle()) {
        <p class="mt-2 text-sm text-blue-100">{{ subtitle() }}</p>
      }
    </div>
    <ng-content />
  </div>
</div>
