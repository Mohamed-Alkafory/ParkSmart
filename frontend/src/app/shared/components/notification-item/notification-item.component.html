<button
  type="button"
  (click)="onSelect()"
  [attr.aria-label]="notification().isRead ? notification().title : 'Mark as read: ' + notification().title"
  class="flex w-full items-start gap-4 rounded-2xl p-4 text-left ring-1 transition hover:shadow-sm"
  [class.bg-white]="!notification().isRead"
  [class.ring-slate-200]="!notification().isRead"
  [class.shadow-sm]="!notification().isRead"
  [class.cursor-pointer]="!notification().isRead"
  [class.bg-white/60]="notification().isRead"
  [class.ring-slate-100]="notification().isRead"
  [class.cursor-default]="notification().isRead"
>
  @switch (variant()) {
    @case ('success') {
      <span class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-emerald-100 text-emerald-600">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
          <path d="M20 6 9 17l-5-5" />
        </svg>
      </span>
    }
    @case ('info') {
      <span class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-[#E8F1FB] text-[#0060C0]">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 16v-4M12 8h.01" />
        </svg>
      </span>
    }
    @case ('alert') {
      <span class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-red-100 text-red-600">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="m15 9-6 6M9 9l6 6" />
        </svg>
      </span>
    }
    @default {
      <span class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-slate-100 text-slate-500">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
        </svg>
      </span>
    }
  }

  <span class="flex min-w-0 flex-1 flex-col gap-1">
    <span class="flex items-start justify-between gap-3">
      <span class="flex min-w-0 items-center gap-2">
        @if (!notification().isRead) {
          <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full bg-[#0060C0]" aria-hidden="true"></span>
        }
        <span
          class="truncate text-[15px]"
          [class.font-bold]="!notification().isRead"
          [class.text-[#003366]]="!notification().isRead"
          [class.font-medium]="notification().isRead"
          [class.text-slate-500]="notification().isRead"
        >{{ notification().title }}</span>
      </span>
      <time class="shrink-0 text-xs text-slate-400">{{ timeLabel() }}</time>
    </span>
    <span
      class="text-sm leading-relaxed"
      [class.text-slate-600]="!notification().isRead"
      [class.text-slate-400]="notification().isRead"
    >{{ notification().message }}</span>
  </span>
</button>
