<!-- Five buttons support both keyboard access and interactive reviews. -->
<div
  class="inline-flex items-center gap-1"
  role="group"
  [attr.aria-label]="'Rating: ' + value() + ' out of 5'"
>
  @for (star of stars; track star) {
    <button
      type="button"
      class="text-2xl leading-none transition"
      [class.text-amber-400]="star <= value()"
      [class.text-slate-300]="star > value()"
      [class.cursor-pointer]="!readonly()"
      [class.hover:scale-110]="!readonly()"
      [class.cursor-default]="readonly()"
      [disabled]="readonly()"
      [attr.aria-label]="'Rate ' + star + ' out of 5'"
      (click)="selectRating(star)"
    >
      ★
    </button>
  }
  <span class="ml-1 text-sm font-medium text-slate-500">{{ value() }}/5</span>
</div>
