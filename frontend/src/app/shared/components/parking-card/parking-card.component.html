<article
  class="group overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm transition duration-300 hover:-translate-y-1 hover:shadow-xl"
>
  <!-- Decorative header keeps the card useful until parking images are added to the model. -->
  <div
    class="relative flex h-36 items-end overflow-hidden bg-gradient-to-br from-slate-900 via-blue-800 to-cyan-600 p-5"
  >
    <div class="absolute -right-8 -top-8 h-32 w-32 rounded-full bg-white/10"></div>
    <div class="absolute right-10 top-8 h-16 w-16 rounded-full bg-cyan-300/10"></div>
    <span
      class="relative rounded-full bg-white/15 px-3 py-1 text-xs font-semibold text-white backdrop-blur"
    >
      Smart parking
    </span>
  </div>

  <div class="space-y-4 p-5">
    <div>
      <h2 class="text-xl font-bold text-slate-900">{{ parking().name }}</h2>
      <p class="mt-1 flex items-start gap-2 text-sm text-slate-500">
        <span aria-hidden="true">📍</span>
        <span>{{ parking().address }}</span>
      </p>
    </div>

    <!-- Rating is shared with review pages. -->
    <div class="flex items-center justify-between gap-3 border-y border-slate-100 py-3">
      <app-rating [value]="parking().rating" [readonly]="true" />
      <div class="text-right">
        <strong class="text-lg text-blue-700">{{ parking().pricePerHour }}</strong>
        <span class="ml-1 text-xs text-slate-500">EGP/hour</span>
      </div>
    </div>

    @if (parking()._id) {
      <a
        [routerLink]="['/parkings', parking()._id]"
        class="block rounded-xl bg-blue-700 px-4 py-3 text-center text-sm font-semibold text-white transition hover:bg-blue-800"
      >
        View parking details
      </a>
    } @else {
      <span
        class="block rounded-xl bg-slate-200 px-4 py-3 text-center text-sm font-semibold text-slate-500"
      >
        Details unavailable
      </span>
    }
  </div>
</article>
