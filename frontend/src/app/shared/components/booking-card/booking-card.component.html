<article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
  <div class="flex items-start justify-between gap-3">
    <div>
      <h3 class="font-bold text-slate-900">{{ parkingName() }}</h3>
      @if (parkingAddress()) {
        <p class="mt-1 flex items-start gap-2 text-sm text-slate-500">
          <span aria-hidden="true">📍</span>
          <span>{{ parkingAddress() }}</span>
        </p>
      }
    </div>
    <app-status-badge [status]="booking().status" />
  </div>

  <dl class="mt-4 grid grid-cols-2 gap-3 border-y border-slate-100 py-3 text-sm">
    @if (spotLabel()) {
      <div>
        <dt class="text-xs text-slate-500">Spot</dt>
        <dd class="font-semibold text-slate-900">{{ spotLabel() }}</dd>
      </div>
    }
    <div>
      <dt class="text-xs text-slate-500">Starts</dt>
      <dd class="font-semibold text-slate-900">
        {{ booking().startTime | date: 'medium' }}
      </dd>
    </div>
    <div>
      <dt class="text-xs text-slate-500">Duration</dt>
      <dd class="font-semibold text-slate-900">{{ booking().durationHours }}h</dd>
    </div>
    <div>
      <dt class="text-xs text-slate-500">Total</dt>
      <dd class="font-semibold text-blue-700">{{ booking().totalPrice }} EGP</dd>
    </div>
  </dl>

  @if (isActive()) {
    <div class="mt-4 flex gap-2">
      <button
        type="button"
        (click)="onComplete()"
        class="flex-1 rounded-xl bg-blue-700 px-4 py-2 text-sm font-semibold text-white transition hover:bg-blue-800"
      >
        Complete
      </button>
      <button
        type="button"
        (click)="onCancel()"
        class="flex-1 rounded-xl border border-red-200 bg-white px-4 py-2 text-sm font-semibold text-red-700 transition hover:bg-red-50"
      >
        Cancel
      </button>
    </div>
  }
</article>
