<div
  class="rounded-2xl border border-red-200 bg-red-50 p-4 text-center"
  role="alert"
>
  <p class="text-sm font-semibold text-red-800">{{ message() }}</p>
  <button
    type="button"
    (click)="retry.emit()"
    class="mt-3 rounded-xl bg-red-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-red-700"
  >
    Try again
  </button>
</div>
