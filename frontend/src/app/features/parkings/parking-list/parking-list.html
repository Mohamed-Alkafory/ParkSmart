<!-- TODO (template): filter inputs (lat/lng/maxDistance) + buttons calling loadAll()/searchNearby(), grid rendering parkings() with @for, routerLink to /parkings/:id. -->
<div class="space-y-6">
  <div class="rounded-2xl bg-white p-6 shadow">
    <h1 class="text-2xl font-bold">Parkings</h1>
    <p class="text-sm text-gray-500">GET /api/parkings + GET /api/parkings/nearby?lat=&lng=&maxDistance=</p>
    <div class="mt-4 grid gap-4 md:grid-cols-3">
      <label class="text-sm font-medium text-gray-700">
        Latitude
        <input
          type="number"
          step="any"
          [ngModel]="lat()"
          (ngModelChange)="lat.set($event)"
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2"
        />
      </label>
      <label class="text-sm font-medium text-gray-700">
        Longitude
        <input
          type="number"
          step="any"
          [ngModel]="lng()"
          (ngModelChange)="lng.set($event)"
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2"
        />
      </label>
      <label class="text-sm font-medium text-gray-700">
        Maximum distance (m)
        <input
          type="number"
          min="0"
          [ngModel]="maxDistance()"
          (ngModelChange)="maxDistance.set($event)"
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2"
        />
      </label>
    </div>
    <div class="mt-4 flex gap-3">
      <button
        type="button"
        (click)="searchNearby()"
        [disabled]="loading()"
        class="rounded-lg bg-blue-600 px-4 py-2 font-medium text-white disabled:opacity-50"
      >
        Search
      </button>
    </div>
    @if (loading()) {
      <p class="mt-3 text-sm text-gray-500">Searching...</p>
    }
    @if (error()) {
      <p class="mt-3 text-sm text-red-600">{{ error() }}</p>
    }
  </div>
  <div class="grid gap-4 md:grid-cols-3">
    @for (p of parkings(); track p._id) {
      <a
        [routerLink]="['/parkings', p._id]"
        class="block rounded-2xl bg-white p-6 shadow transition hover:-translate-y-1 hover:shadow-lg"
      >
        <h2 class="text-lg font-semibold text-gray-900">{{ p.name }}</h2>
        <p class="mt-1 text-sm text-gray-500">{{ p.address }}</p>
        <div class="mt-4 flex items-center justify-between text-sm">
          <span class="font-medium text-blue-600">{{ p.pricePerHour }} / hour</span>
          <span class="text-gray-600">Rating: {{ p.rating }} / 5</span>
        </div>
      </a>
    }
  </div>
</div>
