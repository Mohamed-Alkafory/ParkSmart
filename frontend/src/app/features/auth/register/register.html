<div class="flex min-h-[75vh] items-center justify-center bg-[#F8F8F8] py-8 font-sans sm:py-12">

  <div class="w-full max-w-md">

    <div class="rounded-2xl bg-white p-6 shadow-lg ring-1 ring-slate-200 sm:p-8 lg:p-10">

      <h1 class="text-2xl font-bold tracking-tight text-[#003366] sm:text-3xl">
        Create your account
      </h1>

      <p class="mt-1.5 text-sm text-slate-500 sm:text-base">
        Join ParkSmart in less than a minute
      </p>

      <form class="mt-6 space-y-4" (ngSubmit)="onSubmit()">

        <div>
          <label for="name" class="mb-1.5 block text-sm font-medium text-slate-600">
            Full name
          </label>

          <input
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            placeholder="John Doe"
            [(ngModel)]="name"
            required
            class="w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 transition hover:border-slate-400 focus:border-[#0060C0] focus:outline-none focus:ring-2 focus:ring-[#0060C0]/20"
          />
        </div>

        <div>
          <label for="email" class="mb-1.5 block text-sm font-medium text-slate-600">
            Email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            [(ngModel)]="email"
            required
            class="w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 transition hover:border-slate-400 focus:border-[#0060C0] focus:outline-none focus:ring-2 focus:ring-[#0060C0]/20"
          />
        </div>

        <div>
          <label for="password" class="mb-1.5 block text-sm font-medium text-slate-600">
            Password
          </label>

          <div class="relative">

            <input
              id="password"
              name="password"
              [type]="showPassword() ? 'text' : 'password'"
              autocomplete="new-password"
              placeholder="••••••••"
              [(ngModel)]="password"
              required
              class="w-full rounded-lg border border-slate-300 bg-white py-2.5 pl-3.5 pr-11 text-sm text-slate-900 placeholder:text-slate-400 transition hover:border-slate-400 focus:border-[#0060C0] focus:outline-none focus:ring-2 focus:ring-[#0060C0]/20"
            />

            <button
              type="button"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
              class="absolute inset-y-0 right-0 flex w-10 items-center justify-center text-slate-400 hover:text-slate-600"
            >

              @if (showPassword()) {

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="h-5 w-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
                  />
                </svg>

              } @else {

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="h-5 w-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                </svg>

              }

            </button>

          </div>

          <p class="mt-1 text-xs text-slate-500">
            At least 6 characters with an uppercase letter, a number and a special character.
          </p>
        </div>

        <div>
          <label for="phone" class="mb-1.5 block text-sm font-medium text-slate-600">
            Phone <span class="font-normal text-slate-400">(optional)</span>
          </label>

          <input
            id="phone"
            name="phone"
            type="tel"
            autocomplete="tel"
            placeholder="+1 555 000 0000"
            [(ngModel)]="phone"
            class="w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 transition hover:border-slate-400 focus:border-[#0060C0] focus:outline-none focus:ring-2 focus:ring-[#0060C0]/20"
          />
        </div>

        @if (error()) {

          <div class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700">
            {{ error() }}
          </div>

        }

        <button
          type="submit"
          [disabled]="loading()"
          class="flex w-full items-center justify-center gap-2 rounded-lg bg-[#0060C0] px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-[#003366] disabled:cursor-not-allowed disabled:opacity-60"
        >

          @if (loading()) {

            <span
              class="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"
              aria-hidden="true"
            ></span>

            Creating account…

          } @else {

            Create account

          }

        </button>

      </form>

      <p class="mt-6 text-center text-sm text-slate-500">

        Already have an account?

        <a
          routerLink="/login"
          class="font-semibold text-[#0060C0] hover:underline"
        >
          Sign in
        </a>

      </p>

    </div>

  </div>

</div>
