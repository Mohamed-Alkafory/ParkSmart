<div class="lg:pl-64">
  <app-sidebar [role]="role()" />
  <div class="mx-auto w-full max-w-xl space-y-6">
  <app-page-header eyebrow="New property" title="Add parking" subtitle="After creating it you can add its spots." />

  <!-- Step 1 of 2: create the park, then add its spots. -->
  <ol class="mt-4 flex items-center gap-2 pt-2 text-xs font-semibold">
    <li class="flex items-center gap-2 rounded-full bg-[#0060C0] px-4 py-2 text-white">
      <span class="flex h-5 w-5 items-center justify-center rounded-full bg-white/20">1</span>
      Create park
    </li>
    <li aria-hidden="true" class="text-slate-300">→</li>
    <li class="flex items-center gap-2 rounded-full bg-white px-4 py-2 text-slate-500 ring-1 ring-slate-200">
      <span class="flex h-5 w-5 items-center justify-center rounded-full bg-slate-100">2</span>
      Add spots
    </li>
  </ol>

  <form (ngSubmit)="onSubmit()" class="space-y-4 rounded-2xl bg-white p-6 shadow-sm sm:p-8">
    @if (error()) {
      <p class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{ error() }}</p>
    }
    <label class="block text-sm font-semibold text-slate-700">
      Name
      <input type="text" required maxlength="100" placeholder="Downtown Garage"
        [ngModel]="name()" (ngModelChange)="name.set($event)" name="name"
        class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2 font-normal text-slate-900 focus:border-[#0060C0] focus:outline-none" />
    </label>
    <label class="block text-sm font-semibold text-slate-700">
      Address
      <input type="text" required maxlength="200" placeholder="123 Main St, Cairo"
        [ngModel]="address()" (ngModelChange)="address.set($event)" name="address"
        class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2 font-normal text-slate-900 focus:border-[#0060C0] focus:outline-none" />
    </label>
    <label class="block text-sm font-semibold text-slate-700">
      Price per hour (EGP)
      <input type="number" required min="1" step="any" placeholder="20"
        [ngModel]="pricePerHour()" (ngModelChange)="pricePerHour.set($event)" name="pricePerHour"
        class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2 font-normal text-slate-900 focus:border-[#0060C0] focus:outline-none" />
    </label>
    <div class="grid gap-4 sm:grid-cols-2">
      <label class="block text-sm font-semibold text-slate-700">
        Latitude
        <input type="number" required step="any" placeholder="30.0444"
          [ngModel]="lat()" (ngModelChange)="lat.set($event)" name="lat"
          class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2 font-normal text-slate-900 focus:border-[#0060C0] focus:outline-none" />
      </label>
      <label class="block text-sm font-semibold text-slate-700">
        Longitude
        <input type="number" required step="any" placeholder="31.2357"
          [ngModel]="lng()" (ngModelChange)="lng.set($event)" name="lng"
          class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-2 font-normal text-slate-900 focus:border-[#0060C0] focus:outline-none" />
      </label>
    </div>
    <div>
      <span class="mb-2 block text-sm font-semibold text-slate-700">Photo (optional)</span>
      <app-image-upload
        variant="wide"
        buttonLabel="Choose photo"
        (filePicked)="onImageSelected($event)"
      />
    </div>
    <button type="submit" [disabled]="submitting()"
      class="w-full rounded-xl bg-[#0060C0] px-4 py-3 text-sm font-semibold text-white transition hover:bg-[#003366] disabled:cursor-not-allowed disabled:opacity-50">
      {{ submitting() ? 'Creating...' : 'Create parking' }}
    </button>
    <a routerLink="/owner/parkings" class="block text-center text-sm font-semibold text-[#0060C0] hover:underline">
      Back to My Parkings
    </a>
  </form>
  </div>
</div>
