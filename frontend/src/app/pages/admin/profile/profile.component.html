<section class="mx-auto w-full max-w-3xl space-y-6">
  <!-- Profile header: shared banner with the admin's avatar projected in the action slot. -->
  <app-page-header eyebrow="Administrator" title="{{ user()?.name ?? 'My profile' }}" subtitle="Keep your account information up to date.">
    <app-image-upload
      [currentUrl]="avatarSrc()"
      [initial]="user()?.name ?? 'A'"
      [uploading]="avatarUploading()"
      buttonLabel="Change photo"
      (filePicked)="onAvatarSelected($event)"
    />
  </app-page-header>

  @if (error()) {
    <p class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
      {{ error() }}
    </p>
  }
  @if (message()) {
    <p
      class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700"
    >
      {{ message() }}
    </p>
  }

  <!-- Email and role are read-only; the admin can edit name and phone. -->
  <form
    class="rounded-3xl bg-white p-6 shadow-sm ring-1 ring-slate-200 sm:p-8"
    (ngSubmit)="onSave()"
  >
    <div class="grid gap-5 sm:grid-cols-2">
      <div class="sm:col-span-2">
        <label for="adminName" class="mb-2 block text-sm font-semibold text-slate-700"
          >Full name</label
        >
        <input
          id="adminName"
          name="name"
          type="text"
          required
          class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-[#0060C0] focus:ring-2 focus:ring-[#0060C0]/15"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
        />
      </div>

      <div>
        <label for="adminEmail" class="mb-2 block text-sm font-semibold text-slate-700"
          >Email</label
        >
        <input
          id="adminEmail"
          type="email"
          class="w-full rounded-xl border border-slate-200 bg-slate-100 px-4 py-3 text-slate-500"
          [value]="user()?.email ?? ''"
          disabled
        />
      </div>

      <div>
        <label for="adminPhone" class="mb-2 block text-sm font-semibold text-slate-700"
          >Phone</label
        >
        <input
          id="adminPhone"
          name="phone"
          type="tel"
          class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-[#0060C0] focus:ring-2 focus:ring-[#0060C0]/15"
          placeholder="Your phone number"
          [ngModel]="phone()"
          (ngModelChange)="phone.set($event)"
        />
      </div>

      <div class="sm:col-span-2">
        <label for="adminRole" class="mb-2 block text-sm font-semibold text-slate-700"
          >Account role</label
        >
        <input
          id="adminRole"
          class="w-full rounded-xl border border-slate-200 bg-slate-100 px-4 py-3 capitalize text-slate-500"
          [value]="user()?.role ?? ''"
          disabled
        />
      </div>
    </div>

    <div class="mt-7 flex justify-end">
      <button
        type="submit"
        class="rounded-xl bg-[#0060C0] px-7 py-3 font-semibold text-white transition hover:bg-[#003366] disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="saving() || loading()"
      >
        {{ saving() ? 'Saving...' : 'Save changes' }}
      </button>
    </div>
  </form>
</section>
